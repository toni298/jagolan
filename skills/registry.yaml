version: "1.1.0"
name: agent-engineering-skill-pack
description: >
  A progressive-disclosure engineering skill pack for AI coding agents.
  SKILL.md files act as orchestrators, references contain detailed knowledge,
  and manifests define routing metadata.

routing_principles:
  - Load the smallest useful set of skills.
  - Prefer project-context before implementation.
  - Prefer analysis before planning.
  - Prefer writing-plans before executing large changes.
  - Prefer code-review, security-audit, and test-driven-development before risky changes.
  - Use shared references for global standards.

